junit.jupiter.execution.parallel.enabled=true

# Вариант1. Самая эффективная утилизация ресурсов, когда всё шарим между потоками - и классы, тестовые методы
# junit.jupiter.execution.parallel.mode.default=concurrent
# junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Вариант2. Методы шарятся между потоками, а классы - в одном потоке (параллелизация методов внутри одного класса)
# junit.jupiter.execution.parallel.mode.default=concurrent
# junit.jupiter.execution.parallel.mode.classes.default=same_thread

# Вариант3. Наоборот
#junit.jupiter.execution.parallel.mode.default=same_thread
#junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Вариант4. По сути отключение параллелизации, всё в одном потоке
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread

junit.jupiter.execution.parallel.config.strategy=fixed

junit.jupiter.execution.parallel.config.fixed.parallelism=4

junit.jupiter.execution.parallel.config.fixed.max-pool-size=4

junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrder$OrderAnnotation
